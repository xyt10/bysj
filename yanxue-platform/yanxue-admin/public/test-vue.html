<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vue加载测试</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #f5f5f5;
        }
        .log {
            background: white;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            border-left: 4px solid #42b983;
        }
        .error {
            border-left-color: #f56c6c;
            color: #f56c6c;
        }
        .success {
            border-left-color: #67c23a;
            color: #67c23a;
        }
    </style>
</head>
<body>
    <h1>Vue模块加载测试</h1>
    <div id="logs"></div>

    <script type="module">
        const logsDiv = document.getElementById('logs');

        function log(message, type = 'log') {
            const div = document.createElement('div');
            div.className = `log ${type}`;
            div.textContent = message;
            logsDiv.appendChild(div);
            console.log(message);
        }

        async function testVueLoading() {
            try {
                log('开始测试Vue模块加载...', 'log');

                // 获取最新的版本号
                const metaResponse = await fetch('/node_modules/.vite/deps/_metadata.json');
                const metadata = await metaResponse.json();
                log(`Vite依赖元数据: ${JSON.stringify(metadata.hash)}`, 'log');

                // 尝试加载Vue
                log('正在导入Vue模块...', 'log');
                const vueModule = await import(`/node_modules/.vite/deps/vue.js?v=${metadata.hash}`);

                log('✓ Vue模块加载成功!', 'success');
                log(`Vue版本: ${vueModule.version}`, 'success');

                // 测试创建Vue应用
                const app = vueModule.createApp({
                    template: '<div>测试成功!</div>'
                });
                log('✓ Vue应用创建成功!', 'success');

            } catch (error) {
                log(`✗ 错误: ${error.message}`, 'error');
                log(`错误堆栈: ${error.stack}`, 'error');

                // 尝试直接访问vue.js
                try {
                    const response = await fetch('/node_modules/.vite/deps/vue.js');
                    log(`vue.js HTTP状态: ${response.status}`, response.ok ? 'success' : 'error');
                    const text = await response.text();
                    log(`vue.js文件大小: ${text.length} 字节`, 'log');
                    log(`vue.js前100字符: ${text.substring(0, 100)}`, 'log');
                } catch (fetchError) {
                    log(`✗ 无法访问vue.js: ${fetchError.message}`, 'error');
                }
            }
        }

        testVueLoading();
    </script>
</body>
</html>
