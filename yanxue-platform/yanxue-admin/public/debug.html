<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>调试页面</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
        }
        #logs {
            background-color: #f5f5f5;
            padding: 15px;
            border-radius: 5px;
            max-height: 400px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <h1>研学平台诊断页面</h1>
    <div id="status"></div>
    <h2>诊断日志:</h2>
    <div id="logs"></div>

    <script>
        const statusDiv = document.getElementById('status');
        const logsDiv = document.getElementById('logs');

        function log(message, isError = false) {
            const time = new Date().toLocaleTimeString();
            const logEntry = document.createElement('div');
            logEntry.textContent = `[${time}] ${message}`;
            logEntry.style.color = isError ? 'red' : 'black';
            logsDiv.appendChild(logEntry);
            console.log(message);
        }

        function showStatus(message, isSuccess) {
            const statusMsg = document.createElement('div');
            statusMsg.className = `status ${isSuccess ? 'success' : 'error'}`;
            statusMsg.textContent = message;
            statusDiv.appendChild(statusMsg);
        }

        async function runDiagnostics() {
            log('开始诊断...');

            // 测试1: 检查基本页面加载
            log('✓ HTML页面加载成功');
            showStatus('✓ HTML页面加载成功', true);

            // 测试2: 检查后端API连接
            try {
                log('正在测试后端API连接...');
                const response = await fetch('/api/test', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                log(`后端API响应状态: ${response.status}`);
                if (response.ok) {
                    showStatus('✓ 后端API连接正常', true);
                } else {
                    showStatus(`⚠ 后端API返回状态码: ${response.status}`, false);
                }
            } catch (error) {
                log(`后端API连接失败: ${error.message}`, true);
                showStatus('⚠ 后端API连接失败 (这是正常的,如果后端没有/api/test端点)', false);
            }

            // 测试3: 检查Vue模块加载
            try {
                log('正在测试Vue模块加载...');
                const vueModule = await import('/node_modules/.vite/deps/vue.js?v=b339a7e1');
                log('✓ Vue模块加载成功');
                showStatus('✓ Vue模块加载成功', true);
            } catch (error) {
                log(`Vue模块加载失败: ${error.message}`, true);
                showStatus('✗ Vue模块加载失败', false);
            }

            // 测试4: 检查主应用文件
            try {
                log('正在测试主应用文件加载...');
                const mainResponse = await fetch('/src/main.js');
                if (mainResponse.ok) {
                    log('✓ main.js文件可访问');
                    showStatus('✓ main.js文件可访问', true);
                } else {
                    log(`main.js访问失败: ${mainResponse.status}`, true);
                    showStatus('✗ main.js访问失败', false);
                }
            } catch (error) {
                log(`main.js加载失败: ${error.message}`, true);
                showStatus('✗ main.js加载失败', false);
            }

            log('诊断完成!');
            log('');
            log('如果看到白屏,请:');
            log('1. 打开浏览器开发者工具 (F12)');
            log('2. 查看Console标签页的错误信息');
            log('3. 查看Network标签页,看哪些资源加载失败');
        }

        // 捕获所有错误
        window.onerror = function(msg, url, lineNo, columnNo, error) {
            log(`JavaScript错误: ${msg} at ${url}:${lineNo}:${columnNo}`, true);
            return false;
        };

        // 运行诊断
        runDiagnostics();
    </script>
</body>
</html>
