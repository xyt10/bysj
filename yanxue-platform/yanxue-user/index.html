<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>研学旅行平台</title>
  <link rel="icon" href="/favicon.ico">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Google Fonts: Noto Sans SC for better Chinese typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app"></div>
    <script>
      window.addEventListener('error', function(e) {
        console.error('全局错误:', e.message, '文件:', e.filename, '行号:', e.lineno);
        document.body.innerHTML += '<div style="position:fixed;top:0;left:0;right:0;background:#ffebee;color:#c62828;padding:20px;z-index:99999;font-family:sans-serif;"><strong>页面加载错误:</strong> ' + e.message + '<br>文件: ' + (e.filename || '未知') + '<br>行号: ' + (e.lineno || '未知') + '</div>';
      });
      window.addEventListener('unhandledrejection', function(e) {
        console.error('未处理的Promise错误:', e.reason);
        document.body.innerHTML += '<div style="position:fixed;top:0;left:0;right:0;background:#ffebee;color:#c62828;padding:20px;z-index:99999;font-family:sans-serif;"><strong>Promise错误:</strong> ' + (e.reason && e.reason.message ? e.reason.message : String(e.reason)) + '</div>';
      });
    </script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
